name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.10'
          - os: windows-latest
            python-version: '3.13'
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Parse Python source
        run: python -m compileall -q *.py photosync_tool_assets tests

      - name: Run lint
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest

      - name: Repeat concurrent initialization and import regression
        shell: bash
        run: |
          for attempt in {1..20}; do
            echo "Concurrency regression $attempt/20"
            python -m pytest -q tests/test_import_reliability.py::test_concurrent_imports_never_overwrite tests/test_sqlite_initialization.py
          done

      - name: Check GUI at high DPI
        env:
          QT_SCALE_FACTOR: '2'
        run: python -m pytest -q tests/test_photo_manager_qt_smoke.py

      - name: Require GUI dependency
        run: python -c "from PySide6.QtWidgets import QApplication"

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: |
          python -m twine check dist/*.tar.gz dist/*.whl
          python scripts/check_distributions.py dist

      - name: Smoke test built wheel outside the checkout
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python scripts/smoke_installed.py
