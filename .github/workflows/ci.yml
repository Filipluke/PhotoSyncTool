name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.13'
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Parse Python source
        run: python -m compileall -q *.py photosync_tool_assets tests

      - name: Run lint
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest

      - name: Require GUI dependency
        run: python -c "from PySide6.QtWidgets import QApplication"

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*.tar.gz dist/*.whl

      - name: Smoke test built wheel outside the checkout
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          photo-sorter --help
          python -c "from importlib.metadata import version; import photo_manager_import; from photo_manager_qt import PhotoManagerWindow; from PySide6.QtWidgets import QApplication; app = QApplication([]); print(version('photosync-tool')); print(photo_manager_import.__file__)"
