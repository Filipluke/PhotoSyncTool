name: Release to PyPI and GitHub
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    name: Validate immutable release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Match tag to package version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['RELEASE_REF'] == f'refs/tags/v{version}', 'Run releases only on their matching version tag'
          PY
  tests:
    needs: version
    uses: ./.github/workflows/ci.yml
  windows:
    needs: tests
    uses: ./.github/workflows/windows-exe.yml
  build:
    name: Build Python distributions
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
  publish:
    name: Publish to PyPI
    needs: [build, windows]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
  release:
    name: Publish GitHub release and checksums
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: PhotoManagerPro-windows
          path: dist/
      - name: Create checksums
        run: cd dist && sha256sum *.whl *.tar.gz *.exe > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Photo Manager Pro $RELEASE_TAG" --notes-file RELEASE_NOTES.md
