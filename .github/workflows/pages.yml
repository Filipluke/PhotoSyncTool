name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - "photo_manager*.py"
      - "photosync_tool_assets/**"
      - "pyproject.toml"
      - "scripts/capture_demo_screenshots.py"
      - "scripts/build_site_images.py"
      - "scripts/check_site.py"
      - ".github/workflows/pages.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install screenshot dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Check committed README and screenshot assets
        run: python -c "from scripts.check_site import check_assets; check_assets()"

      - name: Capture current app screenshots
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/capture_demo_screenshots.py

      - name: Build responsive image assets
        run: python scripts/build_site_images.py

      - name: Check responsive layout and image loading
        run: |
          python scripts/check_site.py
          SITE_SCALE=2 python scripts/check_site.py

      - name: Upload static site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
