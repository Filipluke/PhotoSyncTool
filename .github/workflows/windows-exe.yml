name: Windows EXE
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows-exe:
    name: Build Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package and PyInstaller
        run: python -m pip install ".[exe]"
      - name: Build executable
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name PhotoManagerPro
          --icon photosync_tool_assets/photo_manager_icon.ico
          --add-data "photosync_tool_assets;photosync_tool_assets"
          photo_manager_gui.py
      - name: Verify executable startup
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $process = Start-Process -FilePath 'dist/PhotoManagerPro.exe' -PassThru
          Start-Sleep -Seconds 20
          if ($process.HasExited) { throw "Executable exited during startup: $($process.ExitCode)" }
          Stop-Process -Id $process.Id
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoManagerPro-windows
          path: dist/PhotoManagerPro.exe
          if-no-files-found: error
