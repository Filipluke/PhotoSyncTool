name: Windows EXE
on:
  pull_request:
    paths:
      - '*.py'
      - 'photosync_tool_assets/**'
      - 'pyproject.toml'
      - '.github/workflows/windows-exe.yml'
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows-exe:
    name: Build Windows executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - name: Install package and PyInstaller
        run: python -m pip install ".[exe]"
      - name: Build executable
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name PhotoManagerPro
          --icon photosync_tool_assets/photo_manager_icon.ico
          --add-data "photosync_tool_assets;photosync_tool_assets"
          photo_manager_gui.py
      - name: Verify executable startup
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $process = Start-Process -FilePath 'dist/PhotoManagerPro.exe' -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(60000)) {
            Stop-Process -Id $process.Id
            throw 'Executable smoke test timed out'
          }
          if ($process.ExitCode -ne 0) { throw "Executable smoke test failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoManagerPro-windows
          path: dist/PhotoManagerPro.exe
          if-no-files-found: error
